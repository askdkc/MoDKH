name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (arm64)
          - os: ubuntu-26.04 # x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Linuxの実試験依存
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl build-essential poppler-utils
      - name: macOSの実試験依存
        if: runner.os == 'macOS'
        run: brew install sbcl poppler
      - name: 実試験ランタイム確認
        run: |
          sbcl --version
          sbcl --noinform --no-sysinit --no-userinit --non-interactive --eval '(require :asdf)' --eval '(assert (find-package :asdf))'
          cc --version
          make --version
      - name: 依存導入
        run: npm ci
      - name: 型検査とビルド
        run: |
          npm run typecheck
          npm run build
      - name: StaterightのRust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: 前鬼Stateright（実検証・自動登録・導入）
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo fmt --manifest-path native/stateright/Cargo.toml --check
          cargo clippy --locked --manifest-path native/stateright/Cargo.toml --all-targets -- -D warnings
          npm run test:stateright
      - name: オフライン回帰テスト
        run: npm test
      - name: 実レコーダー導入(隔離・解決版とパスを記録)
        run: |
          set -eu
          REPLAY_HOME="$RUNNER_TEMP/agenticreplay-cli"
          mkdir -p "$REPLAY_HOME"
          cd "$REPLAY_HOME"
          npm init -y >/dev/null
          npm_config_cache="$RUNNER_TEMP/agenticreplay-npm-cache" \
            npm install --no-audit --no-fund --loglevel=error agenticreplay@latest >/dev/null
          echo "$REPLAY_HOME/node_modules/.bin" >> "$GITHUB_PATH"
          echo "RECORDER_PATH=$REPLAY_HOME/node_modules/.bin/agenticreplay"
          echo "RECORDER_VERSION=$(./node_modules/.bin/agenticreplay version)"
          test -x "$REPLAY_HOME/node_modules/.bin/agenticreplay"
      - name: 実レコーダー容量枯渇(ソース版・必須)
        run: |
          set -eu
          command -v agenticreplay
          agenticreplay version
          # TAP は必ずファイルへ残し、判定は scripts/assert-replay-tap.sh に一本化する。
          # 未実行・SKIP・fail はすべて失敗になる。
          MODKH_TEST_REAL_AGENTICREPLAY=1 node --test --test-reporter=tap \
            --test-name-pattern='AgenticReplay event log' \
            test/cli.agenticreplay.test.ts > "$RUNNER_TEMP/replay-source.tap" 2>&1 || true
          sh scripts/assert-replay-tap.sh "$RUNNER_TEMP/replay-source.tap" \
            'a full AgenticReplay event log still allows the answer and the following turn' \
            'a rotated AgenticReplay event log stays complete when only the file budget is small'
      - name: tarball 受け入れ(隔離インストール + 固定応答モデルの会話)
        run: env -u MODKH_TEST_REAL_AGENTICREPLAY sh scripts/acceptance.sh
      - name: 実レコーダー容量枯渇(tarball版・必須)
        run: MODKH_TEST_REAL_AGENTICREPLAY=1 sh scripts/acceptance.sh --replay-only
